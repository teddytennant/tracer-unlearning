[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tracer"
version = "0.1.0"
description = "Spectral footprint, whitening, and coverage pursuit for erased-concept identification"
requires-python = ">=3.9"
dependencies = [
  "jax",
  "numpy",
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
